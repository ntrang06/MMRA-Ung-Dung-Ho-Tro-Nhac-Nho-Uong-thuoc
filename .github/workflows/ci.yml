
name: MMRA CI

on:
  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mmra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================
  # 1. ANDROID BUILD
  # ============================================

  android-build:
    name: Android build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0"

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace

  # ============================================
  # 2. ANDROID UNIT TESTS
  # ============================================

  android-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-37.0"

      - name: Run Android unit tests
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

  # ============================================
  # 3. PYTHON SYNTAX
  # ============================================

  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Python syntax
        working-directory: backend
        run: python -m compileall -q app migrations tests

  # ============================================
  # 4. BACKEND UNIT TESTS
  # ============================================

  backend-tests:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: testing
      DATABASE_URL: postgresql+psycopg://mmra_test:unused@127.0.0.1:5432/mmra_test
      FIREBASE_PROJECT_ID: mmra-ci-test
      OTP_PEPPER: ci-only-otp-pepper-not-for-production-123456789
      RESET_TOKEN_PEPPER: ci-only-reset-pepper-not-for-production-123456789

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Test medicine CRUD and idempotency
        run: |
          python -m pytest \
            tests/test_medicine_crud.py \
            tests/test_medicine_idempotency.py \
            -v

      - name: Test medicine lookup
        run: |
          python -m pytest \
            tests/test_medicine_lookup.py \
            -v

      - name: Test schedules and doses
        run: |
          python -m pytest \
            tests/test_schedule_create.py \
            tests/test_schedule_read.py \
            tests/test_schedule_update.py \
            tests/test_schedule_delete.py \
            tests/test_dose_service.py \
            -v

      - name: Test API routes and medication overview
        run: |
          python -m pytest \
            tests/test_route_uniqueness.py \
            tests/test_be3_overview.py \
            -v

      - name: Test Firebase Admin authorization
        run: |
          python -m pytest \
            tests/test_admin_permissions.py \
            -v

      - name: Test Family foundation and permissions
        run: |
          python -m pytest \
            tests/test_family_foundation.py \
            tests/test_family_permissions.py \
            -v

      - name: Test Family shared schedules and doses
        run: |
          python -m pytest \
            tests/test_family_shared.py \
            -v

  # ============================================
  # 5. WEB ADMIN BUILD
  # ============================================

  web-admin-build:
    name: Web Admin build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web_admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web_admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React and TypeScript
        run: npm run build

  # ============================================
  # 6. WEB ADMIN LINT
  # ============================================

  web-admin-lint:
    name: Web Admin lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web_admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web_admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
